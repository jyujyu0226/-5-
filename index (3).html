<!DOCTYPE html>

  <head>

    <title>내 첫 웹페이지</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1 id="main-title">안녕하세요!</h1>

      <div id="box1">박스1</div>
